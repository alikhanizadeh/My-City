services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cityapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cityapp}
      POSTGRES_USER: ${POSTGRES_USER:-cityapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cityapp_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityapp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cityapp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: cityapp-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
  static_data:
